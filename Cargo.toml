[workspace]
resolver = "2"
members = [
    "crates/motioner_core",
    "crates/motioner_eval",
    "crates/motioner_dsl",
    "crates/motioner_render",
    "crates/motioner_io",
    "crates/motioner_app",
    "crates/motioner_testkit",
]
# FerrousEngine is a pinned submodule with its own workspace; its crates are
# consumed as path dependencies by `motioner_render` only.
exclude = ["engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/jvchiappini/Motioner"

[workspace.dependencies]
motioner_core = { path = "crates/motioner_core" }
motioner_eval = { path = "crates/motioner_eval" }
motioner_dsl = { path = "crates/motioner_dsl" }
motioner_render = { path = "crates/motioner_render" }
motioner_io = { path = "crates/motioner_io" }
motioner_testkit = { path = "crates/motioner_testkit" }

# FerrousEngine (pinned submodule, see engine/README.md). Only
# `motioner_render` may depend on these.
ferrous_2d = { path = "engine/ferrous/crates/ferrous_2d" }
ferrous_font = { path = "engine/ferrous/crates/ferrous_font" }
ferrous_renderer = { path = "engine/ferrous/crates/ferrous_renderer", default-features = false }
# Must match the engine's wgpu major version.
wgpu = "23.0"
glam = "0.29"

anyhow = "1.0"
png = "0.17"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
