[package]
name = "motioner_render"
description = "FerrousEngine adapter, compositor and render graph for Motioner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
motioner_core.workspace = true
motioner_eval.workspace = true
ferrous_2d.workspace = true
ferrous_font.workspace = true
ferrous_renderer.workspace = true
wgpu.workspace = true
glam.workspace = true
# Vector path fill/stroke tessellation (D-0029). Already in the engine's graph.
lyon_tessellation = "1.0"

[features]
default = ["engine-gradients"]
# Gradients in the Pure2D pass (D-0030). The pinned FerrousEngine (857b9df)
# has the gradient pass, so this is on by default; the feature is removed
# once the non-gradient path is gone.
engine-gradients = []
# Enables `LivePainter`, the only public API that names a `ferrous_renderer`
# type. Off by default so headless consumers keep an engine-free API boundary.
live = []

[dev-dependencies]
motioner_dsl.workspace = true
motioner_testkit.workspace = true
sha2.workspace = true

[lints]
workspace = true
