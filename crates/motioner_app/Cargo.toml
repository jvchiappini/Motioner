[package]
name = "motioner_app"
description = "Motioner desktop application binary and wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

autobins = false

[[bin]]
name = "motioner"
path = "src/main.rs"

[[bin]]
name = "motioner-cli"
path = "src/bin/motioner-cli.rs"

[[bin]]
name = "motioner-bench"
path = "src/bin/motioner-bench.rs"
required-features = ["alloc-stats"]

[dependencies]
motioner_core.workspace = true
motioner_dsl.workspace = true
motioner_io.workspace = true
motioner_render.workspace = true
motioner_ui.workspace = true
motioner_analysis.workspace = true
motioner_tools.workspace = true
serde_json = "1.0"
anyhow.workspace = true
# Native folder picker, application-only (D-0046).
rfd = "0.15"
cpal = "0.18.2"

[features]
default = []
alloc-count = ["motioner_ui/alloc-count"]
# Counting global allocator for the bench binary.  Normal `motioner` and
# `motioner-cli` builds never enable it.  Re-exported through `motioner_ui`
# so the application crate stays inside the dependency boundaries.
alloc-stats = ["motioner_ui/alloc-stats"]

[dev-dependencies]
png.workspace = true
motioner_testkit.workspace = true

[lints]
workspace = true
